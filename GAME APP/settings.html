<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Optional: Add custom scrollbar styles if desired */
        body {
            /* overflow-y: scroll; Optional, if content might exceed screen height */
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 md:p-8">
    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-4xl flex flex-col md:flex-row space-y-8 md:space-y-0 md:space-x-8">

        <div class="md:w-1/3 flex flex-col items-center border-b md:border-b-0 md:border-r border-gray-200 pb-8 md:pb-0 md:pr-8">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-6 hidden md:block">Profile</h2>
            <div class="profile-picture text-center mb-6">
                <img id="userImage" src="default-avatar.png" alt="Profile Picture" class="w-40 h-40 rounded-full object-cover mx-auto border-4 border-blue-400 shadow-md transform transition-transform duration-300 hover:scale-105">
                <div class="mt-4 w-full px-4">
                    <input type="file" id="imageUpload" accept="image/*" class="block w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-50 file:text-blue-700
                        hover:file:bg-blue-100 cursor-pointer">
                    <button id="uploadImageBtn" class="mt-3 w-full px-4 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">Upload Image</button>
                </div>
            </div>
            <div class="w-full px-4 text-center">
                <h3 id="displayName" class="text-2xl font-semibold text-gray-700 mb-2"></h3>
                <p id="displayEmail" class="text-gray-500 text-sm"></p>
                <button id="logoutBtn" class="mt-6 w-full px-4 py-2 bg-gray-300 text-gray-800 font-semibold rounded-md hover:bg-gray-400 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">Log Out</button>
            </div>
        </div>

        <div class="md:w-2/3 md:pl-8">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-6 md:hidden">Settings</h2>
            <h3 class="text-2xl font-bold text-gray-800 mb-4">Update Profile Details</h3>
            <form id="profileForm" class="mb-8 p-4 border border-gray-200 rounded-lg shadow-sm">
                <div class="mb-4">
                    <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username:</label>
                    <input type="text" id="username" name="username" required
                           class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="mb-6">
                    <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email:</label>
                    <input type="email" id="email" name="email" required
                           class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <button type="submit" class="w-full px-4 py-2 bg-green-600 text-white font-semibold rounded-md hover:bg-green-700 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">Update Profile</button>
            </form>

            <h3 class="text-2xl font-bold text-gray-800 mb-4">Change Password</h3>
            <form id="passwordForm" class="p-4 border border-gray-200 rounded-lg shadow-sm">
                <div class="mb-4">
                    <label for="currentPassword" class="block text-gray-700 text-sm font-bold mb-2">Current Password:</label>
                    <input type="password" id="currentPassword" name="currentPassword" required
                           class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="mb-4">
                    <label for="newPassword" class="block text-gray-700 text-sm font-bold mb-2">New Password:</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6"
                           class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="mb-6">
                    <label for="confirmNewPassword" class="block text-gray-700 text-sm font-bold mb-2">Confirm New Password:</label>
                    <input type="password" id="confirmNewPassword" name="confirmNewPassword" required minlength="6"
                           class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <button type="submit" class="w-full px-4 py-2 bg-red-600 text-white font-semibold rounded-md hover:bg-red-700 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-50">Change Password</button>
            </form>

            <div id="message" class="message mt-6 p-3 rounded-md text-center hidden" role="alert"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userImage = document.getElementById('userImage');
            const displayName = document.getElementById('displayName');
            const displayEmail = document.getElementById('displayEmail');
            const usernameInput = document.getElementById('username');
            const emailInput = document.getElementById('email');
            const profileForm = document.getElementById('profileForm');
            const passwordForm = document.getElementById('passwordForm');
            const messageDiv = document.getElementById('message');
            const imageUploadInput = document.getElementById('imageUpload');
            const uploadImageBtn = document.getElementById('uploadImageBtn');
            const logoutBtn = document.getElementById('logoutBtn');

            // --- API Endpoints (PLACEHOLDERS - Replace with your actual backend paths) ---
            const API_GET_USER_PROFILE = 'http://localhost:5000/api/user/profile'; // GET: Fetches user details
            const API_UPDATE_USER_PROFILE = 'http://localhost:5000/api/user/profile/update'; // PUT: Updates username, email
            const API_UPDATE_PASSWORD = 'http://localhost:5000/api/user/password/update'; // PUT: Updates user password
            const API_UPLOAD_IMAGE = 'http://localhost:5000/api/user/upload-image'; // POST: Uploads user profile image
            // --- End API Endpoints ---

            // Function to get Auth Token
            const getAuthToken = () => {
                return localStorage.getItem('token'); // Retrieve token from localStorage
            };

            // Function to display messages with Tailwind classes
            const showMessage = (msg, type) => {
                messageDiv.textContent = msg;
                messageDiv.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'border', 'border-green-400', 'bg-red-100', 'text-red-800', 'border', 'border-red-400');

                if (type === 'success') {
                    messageDiv.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-400');
                } else if (type === 'error') {
                    messageDiv.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-400');
                }
                messageDiv.classList.remove('hidden');

                setTimeout(() => {
                    messageDiv.classList.add('hidden');
                }, 3000);
            };

            // Fetch user details on page load (or load from localStorage if available)
            const loadUserDetails = async () => {
                const isLoggedIn = localStorage.getItem('isLoggedIn');
                const storedUser = localStorage.getItem('user');
                const token = getAuthToken();

                if (isLoggedIn === 'true' && storedUser && token) {
                    try {
                        const userData = JSON.parse(storedUser);
                        usernameInput.value = userData.username || '';
                        emailInput.value = userData.email || '';
                        userImage.src = userData.image || 'default-avatar.png';
                        displayName.textContent = userData.username || 'Guest User';
                        displayEmail.textContent = userData.email || '';
                        console.log('User details loaded from localStorage.');
                    } catch (e) {
                        console.error('Error parsing user data from localStorage:', e);
                        // Fallback to fetching from API if localStorage is corrupt
                        fetchUserDetailsFromAPI();
                    }
                } else {
                    console.log('Not logged in or user data missing. Redirecting to login...');
                    showMessage('You are not logged in. Redirecting to login page.', 'error');
                    setTimeout(() => {
                        window.location.href = 'index.html'; // Redirect to your main login page
                    }, 2000);
                }
            };

            // Function to fetch user details from the backend API (fallback/refresh)
            const fetchUserDetailsFromAPI = async () => {
                const token = getAuthToken();
                if (!token) {
                    console.error('Authentication token is missing. Redirecting to login.');
                    showMessage('Please log in to view your profile.', 'error');
                    setTimeout(() => {
                        window.location.href = 'index.html'; // Redirect to login page if no token
                    }, 2000);
                    return;
                }

                try {
                    const response = await fetch(API_GET_USER_PROFILE, {
                         headers: {
                             'Authorization': `Bearer ${token}`
                         }
                    });

                    if (!response.ok) {
                        if (response.status === 401) {
                            console.error('Unauthorized: User token invalid or expired. Redirecting to login.');
                            showMessage('Your session has expired. Please log in again.', 'error');
                            localStorage.removeItem('token');
                            localStorage.removeItem('user');
                            localStorage.removeItem('isLoggedIn');
                            setTimeout(() => {
                                window.location.href = 'index.html'; // Redirect to login
                            }, 2000);
                        }
                        const errorData = await response.json();
                        throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                    }
                    const userData = await response.json();
                    usernameInput.value = userData.username || '';
                    emailInput.value = userData.email || '';
                    userImage.src = userData.image || 'default-avatar.png';
                    displayName.textContent = userData.username || 'Guest User';
                    displayEmail.textContent = userData.email || '';

                    // Update localStorage with fresh data
                    localStorage.setItem('user', JSON.stringify(userData));
                    localStorage.setItem('isLoggedIn', 'true'); // Ensure it's true
                    console.log('User details fetched from API and updated localStorage.');

                } catch (error) {
                    console.error('Error fetching user details from API:', error.message);
                    showMessage(`Failed to load user details: ${error.message}. Please refresh.`, 'error');
                }
            };

            // Call to load user details (prioritizes localStorage, then API)
            await loadUserDetails();

            // Handle profile update
            profileForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const updatedUsername = usernameInput.value.trim();
                const updatedEmail = emailInput.value.trim();

                if (!updatedUsername || !updatedEmail) {
                    showMessage('Username and Email cannot be empty.', 'error');
                    return;
                }

                const token = getAuthToken();
                if (!token) {
                    showMessage('Authentication token missing. Please log in.', 'error');
                    return;
                }

                try {
                    const response = await fetch(API_UPDATE_USER_PROFILE, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            username: updatedUsername,
                            email: updatedEmail
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showMessage('Profile updated successfully!', 'success');
                        // Update localStorage with new data and refresh UI
                        const currentUser = JSON.parse(localStorage.getItem('user'));
                        const updatedUser = { ...currentUser, username: updatedUsername, email: updatedEmail };
                        localStorage.setItem('user', JSON.stringify(updatedUser));
                        displayName.textContent = updatedUsername;
                        displayEmail.textContent = updatedEmail;
                    } else {
                        showMessage(data.message || 'Failed to update profile.', 'error');
                    }
                } catch (error) {
                    console.error('Error updating profile:', error);
                    showMessage('An error occurred while updating profile.', 'error');
                }
            });

            // Handle password change
            passwordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const currentPassword = document.getElementById('currentPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmNewPassword = document.getElementById('confirmNewPassword').value;

                if (!currentPassword || !newPassword || !confirmNewPassword) {
                    showMessage('All password fields are required.', 'error');
                    return;
                }

                if (newPassword !== confirmNewPassword) {
                    showMessage('New passwords do not match!', 'error');
                    return;
                }
                if (newPassword.length < 6) {
                    showMessage('New password must be at least 6 characters long!', 'error');
                    return;
                }

                const token = getAuthToken();
                if (!token) {
                    showMessage('Authentication token missing. Please log in.', 'error');
                    return;
                }

                try {
                    const response = await fetch(API_UPDATE_PASSWORD, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            currentPassword,
                            newPassword
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showMessage('Password updated successfully!', 'success');
                        passwordForm.reset(); // Clear password fields
                    } else {
                        showMessage(data.message || 'Failed to update password. Check your current password.', 'error');
                    }
                } catch (error) {
                    console.error('Error updating password:', error);
                    showMessage('An error occurred while changing password.', 'error');
                }
            });

            // Handle image upload
            uploadImageBtn.addEventListener('click', async () => {
                const file = imageUploadInput.files[0];
                if (!file) {
                    showMessage('Please select an image to upload.', 'error');
                    return;
                }

                const formData = new FormData();
                formData.append('profileImage', file); // 'profileImage' should match your backend's expected field name for the file

                const token = getAuthToken();
                if (!token) {
                    showMessage('Authentication token missing. Please log in.', 'error');
                    return;
                }

                try {
                    const response = await fetch(API_UPLOAD_IMAGE, {
                        method: 'POST',
                        headers: {
                            // 'Content-Type': 'multipart/form-data' is automatically set by the browser when using FormData
                            'Authorization': `Bearer ${token}`
                        },
                        body: formData
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showMessage('Image uploaded successfully!', 'success');
                        userImage.src = data.imageUrl; // Update image preview with the new URL from backend
                        
                        // Update localStorage with the new image URL
                        const currentUser = JSON.parse(localStorage.getItem('user'));
                        const updatedUser = { ...currentUser, image: data.imageUrl };
                        localStorage.setItem('user', JSON.stringify(updatedUser));

                        imageUploadInput.value = ''; // Clear the file input
                    } else {
                        showMessage(data.message || 'Failed to upload image.', 'error');
                    }
                } catch (error) {
                    console.error('Error uploading image:', error);
                    showMessage('An error occurred during image upload.', 'error');
                }
            });

            // Handle Logout
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                localStorage.removeItem('isLoggedIn');
                window.location.href = 'index.html'; // Redirect to your login/signup page
            });
        });
    </script>
</body>
</html>
