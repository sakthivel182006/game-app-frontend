<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6; /* Tailwind gray-100 */
            font-family: sans-serif;
            color: #333;
        }
        .message-box {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #3b82f6; /* Tailwind blue-500 */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="message-box">
        <div class="spinner"></div>
        <p class="text-lg font-semibold" id="loginStatus">Processing your login...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loginStatusElement = document.getElementById('loginStatus');

            const email = localStorage.getItem('tempLoginEmail');
            const password = localStorage.getItem('tempLoginPassword'); // WARNING: NEVER do this with real passwords

            // Clear the temporary storage immediately after reading
            localStorage.removeItem('tempLoginEmail');
            localStorage.removeItem('tempLoginPassword');

            if (!email || !password) {
                loginStatusElement.textContent = 'Login details missing. Redirecting to login page...';
                setTimeout(() => {
                    window.location.href = 'index.html'; // Go back to the main login page
                }, 2000);
                return;
            }

            // --- SIMULATE BACKEND LOGIN (REPLACE WITH REAL API CALL) ---
            // In a real scenario, this would be an actual fetch request to your backend's login API
            const BACKEND_LOGIN_API = 'http://localhost:5000/api/auth/login'; // Your actual backend login API

            try {
                const response = await fetch(BACKEND_LOGIN_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Simulating successful login: Store token and user data
                    localStorage.setItem('token', data.token); // Store the JWT
                    localStorage.setItem('user', JSON.stringify(data.user)); // Store user data (username, email, image)
                    localStorage.setItem('isLoggedIn', 'true'); // Set the flag

                    loginStatusElement.textContent = 'Login successful! Redirecting to settings...';
                    setTimeout(() => {
                        window.location.href = 'settings.html';
                    }, 1500); // Redirect after a short delay
                } else {
                    loginStatusElement.textContent = `Login failed: ${data.message || 'Invalid credentials'}. Redirecting...`;
                    localStorage.removeItem('isLoggedIn'); // Ensure logged out state
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    setTimeout(() => {
                        window.location.href = 'index.html'; // Go back to login page on failure
                    }, 2000);
                }
            } catch (error) {
                console.error('Network or login error:', error);
                loginStatusElement.textContent = 'Network error or unable to log in. Redirecting...';
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                setTimeout(() => {
                    window.location.href = 'index.html'; // Go back to login page on error
                }, 2000);
            }
            // --- END SIMULATED BACKEND LOGIN ---
        });
    </script>
</body>
</html>
